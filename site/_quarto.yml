# Site about the plugin. The source is this folder. A GitHub Action
# (.github/workflows/publish.yml) renders it and publishes it to the gh-pages
# branch, which GitHub Pages serves. Nothing here is installed with the
# plugin (the plugin is the plugin/ folder).
# Pages are written by hand at the level that changes slowly, and link to the
# source on GitHub for detail. Each page says which version it was written for.
project:
  type: website
  output-dir: _site
  pre-render:
    - python3 scripts/draw_workflow.py

website:
  title: "R Analysis Workflow"
  site-url: https://vagishhemmige.github.io/r-analysis-workflow
  repo-url: https://github.com/VagishHemmige/r-analysis-workflow
