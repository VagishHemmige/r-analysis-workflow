<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 750" width="1280" height="750" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Structure your R analysis for LLM coding</title>
  <desc id="d">Three places. On your computer, a person runs the R code on the data, and the data stay there. GitHub holds the analysis plan, decision issues, R code, pull requests and history, and people review, decide and merge there. The AI assistant with the plugin reads the plan, issues and code from GitHub and proposes code as a pull request, which a person approves. Code moves between the computer and GitHub, and between GitHub and the assistant; data never leave the computer. The project website is built from the code on GitHub.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
    <!-- A generic person: head and shoulders, drawn, not anyone in particular -->
    <symbol id="person" viewBox="-20 -34 40 40" overflow="visible">
      <circle cx="0" cy="-22" r="10"/>
      <path d="M-17,6 C-17,-8 -9,-10 0,-10 C9,-10 17,-8 17,6 Z"/>
    </symbol>
  </defs>
  <rect width="1280" height="750" fill="#ffffff"/>

  <!-- Title and subtitle -->
  <text x="640" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#212529">Structure your R analysis for LLM coding</text>
  <text x="640" y="98" text-anchor="middle" font-size="19" fill="#495057">The plugin gives the work a structure. The GitHub repository holds that structure.</text>
  <text x="640" y="125" text-anchor="middle" font-size="19" fill="#495057">An AI assistant, working from it, can write the code, and people decide and approve.</text>

  <!-- ===== Your computer ===== -->
  <rect x="30" y="170" width="340" height="400" rx="14" fill="#eef4fb" stroke="#2780e3" stroke-width="2"/>
  <text x="200" y="208" text-anchor="middle" font-size="22" font-weight="700" fill="#1a5fa8">Your computer</text>
  <use href="#person" x="58" y="226" width="44" height="44" fill="#2780e3"/>
  <text x="112" y="246" font-size="16" fill="#212529">You run the R code</text>
  <text x="112" y="266" font-size="16" fill="#212529">on the data, here</text>
  <!-- code file -->
  <rect x="62" y="300" width="34" height="42" rx="3" fill="#ffffff" stroke="#495057" stroke-width="1.5"/>
  <line x1="69" y1="312" x2="89" y2="312" stroke="#adb5bd" stroke-width="2"/>
  <line x1="69" y1="320" x2="85" y2="320" stroke="#adb5bd" stroke-width="2"/>
  <line x1="69" y1="328" x2="89" y2="328" stroke="#adb5bd" stroke-width="2"/>
  <text x="112" y="318" font-size="16" fill="#212529"><tspan font-weight="700">R code</tspan>: a working copy</text>
  <text x="112" y="338" font-size="16" fill="#495057">of what is on GitHub</text>
  <!-- data cylinder with lock -->
  <ellipse cx="79" cy="392" rx="20" ry="7" fill="#ffffff" stroke="#495057" stroke-width="1.5"/>
  <path d="M59,392 L59,424 A20,7 0 0 0 99,424 L99,392" fill="#ffffff" stroke="#495057" stroke-width="1.5"/>
  <path d="M59,408 A20,7 0 0 0 99,408" fill="none" stroke="#495057" stroke-width="1.2"/>
  <rect x="88" y="412" width="16" height="13" rx="2" fill="#343a40"/>
  <path d="M91,412 L91,407 A5,5 0 0 1 101,407 L101,412" fill="none" stroke="#343a40" stroke-width="2"/>
  <text x="112" y="400" font-size="16" fill="#212529"><tspan font-weight="700">Data</tspan>: stay here</text>
  <text x="112" y="420" font-size="16" fill="#495057">never sent to GitHub</text>
  <text x="112" y="440" font-size="16" fill="#495057">or to the assistant</text>
  <line x1="56" y1="464" x2="344" y2="464" stroke="#c5d6ea" stroke-width="1"/>
  <text x="200" y="490" text-anchor="middle" font-size="16" font-style="italic" fill="#1a5fa8">Results leave only once</text>
  <text x="200" y="512" text-anchor="middle" font-size="16" font-style="italic" fill="#1a5fa8">they are cleared for release</text>

  <!-- ===== GitHub ===== -->
  <rect x="470" y="170" width="340" height="400" rx="14" fill="#f8f9fa" stroke="#212529" stroke-width="2.5"/>
  <text x="640" y="208" text-anchor="middle" font-size="22" font-weight="700" fill="#212529">GitHub</text>
  <g font-size="16" fill="#212529">
    <text x="494" y="246"><tspan font-weight="700">Analysis plan</tspan><tspan fill="#495057">: what it must do</tspan></text>
    <text x="494" y="276"><tspan font-weight="700">Decision issues</tspan><tspan fill="#495057">: open questions</tspan></text>
    <text x="494" y="306"><tspan font-weight="700">R code</tspan><tspan fill="#495057">: the shared copy</tspan></text>
    <text x="494" y="336"><tspan font-weight="700">Pull requests</tspan><tspan fill="#495057">: every change</tspan></text>
    <text x="494" y="366"><tspan font-weight="700">History</tspan><tspan fill="#495057">: who did what, when</tspan></text>
  </g>
  <line x1="494" y1="392" x2="786" y2="392" stroke="#ced4da" stroke-width="1"/>
  <use href="#person" x="512" y="404" width="40" height="40" fill="#495057"/>
  <use href="#person" x="544" y="404" width="40" height="40" fill="#868e96"/>
  <use href="#person" x="576" y="404" width="40" height="40" fill="#6c757d"/>
  <text x="626" y="424" font-size="16" fill="#212529">People decide,</text>
  <text x="626" y="444" font-size="16" fill="#212529">review and merge</text>
  <text x="640" y="490" text-anchor="middle" font-size="16" font-style="italic" fill="#495057">The shared memory: the next person</text>
  <text x="640" y="512" text-anchor="middle" font-size="16" font-style="italic" fill="#495057">starts here, not from a laptop or a chat</text>

  <!-- ===== AI assistant ===== -->
  <rect x="910" y="170" width="340" height="400" rx="14" fill="#fdf0f6" stroke="#d63384" stroke-width="2"/>
  <text x="1080" y="208" text-anchor="middle" font-size="22" font-weight="700" fill="#a3245f">AI assistant + plugin</text>
  <!-- simple assistant mark: chat bubble -->
  <path d="M940,232 h40 a8,8 0 0 1 8,8 v20 a8,8 0 0 1 -8,8 h-24 l-10,10 v-10 h-6 a8,8 0 0 1 -8,-8 v-20 a8,8 0 0 1 8,-8 z" fill="#d63384"/>
  <circle cx="950" cy="250" r="3" fill="#ffffff"/><circle cx="960" cy="250" r="3" fill="#ffffff"/><circle cx="970" cy="250" r="3" fill="#ffffff"/>
  <g font-size="16" fill="#212529">
    <text x="1000" y="246">The plugin tells it</text>
    <text x="1000" y="266">how this kind of</text>
    <text x="1000" y="286">project works</text>
    <text x="936" y="330">• reads the plan, open</text>
    <text x="950" y="350">questions and code</text>
    <text x="936" y="382">• writes code on a branch</text>
    <text x="936" y="414">• proposes it as a</text>
    <text x="950" y="434">pull request</text>
  </g>
  <text x="1080" y="490" text-anchor="middle" font-size="16" font-style="italic" fill="#a3245f">Drafts and implements;</text>
  <text x="1080" y="512" text-anchor="middle" font-size="16" font-style="italic" fill="#a3245f">never decides, never sees the data</text>

  <!-- ===== Code between computer and GitHub ===== -->
  <line x1="372" y1="290" x2="466" y2="290" stroke="#495057" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="466" y1="340" x2="374" y2="340" stroke="#495057" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="420" y="272" text-anchor="middle" font-size="14" fill="#495057">code</text>
  <text x="420" y="364" text-anchor="middle" font-size="14" fill="#495057">code</text>

  <!-- Data blocked -->
  <line x1="372" y1="410" x2="430" y2="410" stroke="#c92a2a" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="430" y1="400" x2="450" y2="420" stroke="#c92a2a" stroke-width="3"/>
  <line x1="450" y1="400" x2="430" y2="420" stroke="#c92a2a" stroke-width="3"/>
  <text x="420" y="440" text-anchor="middle" font-size="13" fill="#c92a2a">no data</text>

  <!-- ===== Code between GitHub and the assistant ===== -->
  <line x1="812" y1="290" x2="906" y2="290" stroke="#495057" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="860" y="272" text-anchor="middle" font-size="14" fill="#495057">reads</text>
  <line x1="906" y1="350" x2="814" y2="350" stroke="#495057" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="860" y="374" text-anchor="middle" font-size="14" fill="#495057">proposes</text>
  <!-- human in the loop on the pull request -->
  <use href="#person" x="841" y="384" width="38" height="38" fill="#2b8a3e"/>
  <text x="860" y="440" text-anchor="middle" font-size="13" fill="#2b8a3e">a person</text>
  <text x="860" y="456" text-anchor="middle" font-size="13" fill="#2b8a3e">approves</text>

  <!-- ===== Website ===== -->
  <line x1="640" y1="572" x2="640" y2="626" stroke="#495057" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="654" y="604" font-size="14" fill="#495057">built from the code</text>
  <rect x="470" y="630" width="340" height="96" rx="14" fill="#eef7f1" stroke="#198754" stroke-width="2"/>
  <text x="640" y="666" text-anchor="middle" font-size="22" font-weight="700" fill="#146c43">Project website</text>
  <text x="640" y="698" text-anchor="middle" font-size="16" fill="#212529">explains each step for a clinician reader</text>
</svg>
